name: Status check

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: status-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out the checker
        uses: actions/checkout@v4

      - name: Check out the data branch
        run: |
          git fetch origin data:data 2>/dev/null || true
          if git show-ref --quiet refs/heads/data; then
            git worktree add data-branch data
          else
            git worktree add --orphan -b data data-branch
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Probe Tapra
        run: node scripts/check.mjs data-branch/status.json maintenance.json

      - name: Save the result
        working-directory: data-branch
        run: |
          git config user.name 'tapra-status'
          git config user.email 'status@tapra.tn'
          git add status.json
          # One commit, amended each run, so the data branch never grows.
          git commit --quiet --amend --no-edit 2>/dev/null || git commit --quiet -m 'status data'
          git push --force --quiet origin data
